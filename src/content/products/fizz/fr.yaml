rules:
  kicker: Les petits caractères
  title: Les règles, en clair
  intro: Un résumé du programme de référence Fizz. La [FAQ officielle]({termsUrl}) de Fizz a toujours préséance.
  items:
    - Le code fonctionne seulement sur votre **premier forfait Fizz** — chaque personne ne peut être invitée qu’une fois.
    - Votre forfait doit être d’au moins **{minDeposit} par mois**, avant taxes et après les rabais applicables.
    - La prime est appliquée quand vous avez complété **deux mois de service**, si vous et la personne qui vous a invité avez encore un forfait actif.
    - La prime est un **crédit sur vos paiements mensuels**, pas de l’argent. Le solde restant passe au paiement suivant.
    - Oublié le code? Il **ne peut pas être ajouté rétroactivement**, ni sur un deuxième forfait.
    - Le montant peut **varier selon la province** et l’offre en vigueur au moment de l’abonnement.
    - Un **code promo ne peut pas être combiné** avec un code de référence.
    - Si votre forfait est désactivé, les primes en attente et votre solde sont perdus.
  note: Résumé de la FAQ sur le programme de référence Fizz au {verifiedDate}. Les offres peuvent changer en tout temps.
faq:
  kicker: FAQ
  title: Code de référence Fizz — FAQ
  items:
    - q: Quel est le code de référence Fizz?
      a: Le code de référence Fizz est **{code}**. Entrez-le à l’activation de votre premier forfait Fizz (mobile ou Internet résidentiel) pour obtenir une prime de {bonus} après deux mois de service.
    - q: Combien vaut la prime de référence Fizz en {year}?
      a: Fizz offre présentement **{bonus} pour vous et {bonus} pour le membre qui vous a invité**. Le montant peut varier selon la province et l’offre en vigueur à l’abonnement — consultez la [page de référence]({inviteUrl}) de Fizz.
    - q: Quand vais-je recevoir mes {bonus}?
      a: Après votre **deuxième paiement mensuel**. Les deux primes sont en attente jusque-là, puis la vôtre est appliquée sur votre prochain paiement.
    - q: Où entrer le code de référence Fizz?
      a: Pour un forfait mobile, dans le **résumé de la commande** avant de terminer l’activation. Pour l’Internet résidentiel, **avant l’étape du paiement**. Fizz précise que le code ne peut pas être entré lors de la commande d’une carte SIM physique.
    - q: Puis-je ajouter un code de référence Fizz après mon inscription?
      a: Non. Fizz ne peut pas appliquer un code de référence rétroactivement, et le champ n’apparaît pas pour un deuxième forfait. Entrez **{code}** avant de terminer votre première commande.
    - q: Le code fonctionne-t-il pour l’Internet résidentiel Fizz?
      a: Oui — pourvu que ce soit votre **premier forfait Fizz**. Si vous avez déjà un forfait mobile Fizz, vous ne pouvez pas utiliser de code de référence pour l’Internet (et vice versa).
    - q: Y a-t-il un prix minimum de forfait?
      a: "Oui : votre forfait doit être d’au moins **{minDeposit} par mois**, avant taxes et après les rabais applicables."
    - q: Existe-t-il plutôt un code promo Fizz?
      a: "Fizz offre parfois des codes promo pour les forfaits mobiles, mais **un code promo ne peut pas être combiné avec un code de référence** : c’est l’un ou l’autre. Voir la [FAQ de Fizz sur les primes et codes promo]({rewardsUrl})."
    - q: La prime est-elle versée en argent?
      a: Non. C’est un crédit appliqué sur vos paiements de forfait Fizz; le solde restant sert aux paiements suivants.
    - q: Le code fonctionne-t-il au Québec et dans les autres provinces?
      a: Oui, partout où Fizz est offert. Chaque membre reçoit le montant de prime en vigueur dans sa propre région au moment de l’abonnement.
    - q: Le code {code} est-il légitime et valide?
      a: Oui. **{code}** est le code de référence personnel d’un membre Fizz actif, vérifié le {verifiedDate}. Ce site n’est pas affilié à Fizz; quand vous utilisez le code, le membre qui l’a partagé reçoit aussi une prime — c’est le principe du programme.
