rules:
  kicker: Fine print
  title: The rules, in plain English
  intro: A summary of Fizz’s referral program. Fizz’s [official FAQ]({termsUrl}) always takes precedence.
  items:
    - The code only works on your **first Fizz plan** — each person can be invited once.
    - Your plan must be at least **{minDeposit}/month**, before taxes and after applicable discounts.
    - The bonus is applied once you’ve completed **two months of service**, if both you and your referrer still have an active plan.
    - The bonus is a **credit on your monthly payments**, not cash. Any leftover balance carries to the next payment.
    - Forgot the code? It **can’t be added retroactively**, including on a second plan.
    - The amount can **vary by province** and depends on the offer in effect when you subscribe.
    - A **promo code can’t be combined** with a referral code.
    - If your plan is deactivated, pending bonuses and your remaining balance are lost.
  note: Summarized from Fizz’s referral FAQ on {verifiedDate}. Offers can change at any time.
faq:
  kicker: FAQ
  title: Fizz referral code — FAQ
  items:
    - q: What is the Fizz referral code?
      a: The Fizz referral code is **{code}**. Enter it when you activate your first Fizz plan (mobile or Home Internet) to get a {bonus} bonus once you’ve completed two months of service.
    - q: How much is the Fizz referral bonus in {year}?
      a: Fizz currently offers **{bonus} for you and {bonus} for the member who invited you**. The amount can vary by province and with the offer in effect when you subscribe — check Fizz’s [referral page]({inviteUrl}).
    - q: When do I get my {bonus}?
      a: After your **second monthly payment**. Both bonuses stay pending until then, and yours is applied toward your upcoming payment.
    - q: Where do I enter the Fizz referral code?
      a: For a mobile plan, in the **order summary** before you complete your activation. For Home Internet, **before the payment step**. Fizz notes the code can’t be entered when ordering a physical SIM card.
    - q: Can I add a Fizz referral code after signing up?
      a: No. Fizz can’t apply a referral code retroactively, and the field doesn’t appear on a second plan. Enter **{code}** before you finish your first order.
    - q: Does the code work for Fizz Home Internet?
      a: Yes — as long as it’s your **first Fizz plan**. If you already have a Fizz mobile plan, you can’t use a referral code on Internet (and vice versa).
    - q: Is there a minimum plan price?
      a: "Yes: your plan must be at least **{minDeposit}/month**, before taxes and after applicable discounts."
    - q: Is there a Fizz promo code instead?
      a: Fizz sometimes offers promo codes for mobile plans, but **a promo code can’t be combined with a referral code** — you choose one or the other. See Fizz’s [FAQ on bonuses and promo codes]({rewardsUrl}).
    - q: Is the bonus paid in cash?
      a: No. It’s a credit applied to your Fizz plan payments; any remaining balance is used on the following payments.
    - q: Does the code work in Quebec and other provinces?
      a: Yes, wherever Fizz is offered. Each member receives the bonus amount in effect in their own region at the time of subscription.
    - q: Is {code} a legit, working Fizz code?
      a: Yes. **{code}** is a personal referral code from an active Fizz member, last verified on {verifiedDate}. This site isn’t affiliated with Fizz; when you use the code, the member who shared it also gets a bonus — that’s how the program works.
