rules:
  kicker: Fine print
  title: The rules, in plain English
  intro: A summary of Wealthsimple’s referral bonus terms. The [official terms]({termsUrl}) always take precedence.
  items:
    - You must be a **new Wealthsimple client**, a legal resident of Canada and the age of majority in your province or territory.
    - Deposit at least **{minDeposit}** from an external bank account or financial institution within **30 days** of the referral being linked.
    - Money moved between Wealthsimple clients, Wealthsimple bonuses and other internal transfers **don’t count**.
    - You must be the **primary account holder** of the funded account.
    - The bonus is paid into your Wealthsimple **Chequing** account — open one (it’s free) to receive it.
    - One referrer per new client, and you can’t refer back the person who referred you.
    - The terms include a **180-day hold period** once the bonus is applied — read them before moving money out.
  note: Summarized from Wealthsimple’s Referral Bonus Promotion terms on {verifiedDate}. Promotions can change at any time.
faq:
  kicker: FAQ
  title: Wealthsimple referral code — FAQ
  items:
    - q: What is the Wealthsimple referral code?
      a: The Wealthsimple referral code is **{code}**. Enter it when you open your account, or sign up through [{linkDisplay}]({link}) and it’s applied automatically. You get a {bonus} cash bonus once you deposit {minDeposit} or more.
    - q: How much is the Wealthsimple referral bonus in {year}?
      a: It’s **{bonus} in cash** for you, and {bonus} for the person who referred you. It’s paid into your Wealthsimple Chequing account, usually within 24 hours of your qualifying deposit.
    - q: Is there a Wealthsimple promo code?
      a: "For new clients, the referral code **is** the sign-up promo code: use **{code}** to get {bonus}. Wealthsimple also runs time-limited offers (such as transfer matches) listed on its [official promotions page]({promotionsUrl}) — check each offer’s terms."
    - q: Can I add a referral code after signing up?
      a: Yes, within **7 days of funding** your account. In the app, tap the gift icon → *Invite friends* → *Enter referral code* (on the web, click the gift icon on Home) and type **{code}**.
    - q: Does transferring an account from another bank count for the bonus?
      a: Money coming from another financial institution counts as external funding, so a transfer can qualify if it lands within the 30-day window. Transfers can take a few weeks, though — a regular {minDeposit} deposit from your bank is the fastest way to trigger the {bonus}. For how transfers work, see [Wealthsimple’s transfer guide]({transferUrl}).
    - q: What is the minimum deposit to get the bonus?
      a: "**{minDeposit}**, from an outside bank account or financial institution, within 30 days of the referral being linked. Transfers from other Wealthsimple clients and internal bonuses don’t count."
    - q: Which Wealthsimple accounts qualify?
      a: Self-directed investing accounts (including TFSA, RRSP, FHSA and non-registered), Crypto, Managed investing and Chequing accounts are all eligible.
    - q: When will I receive my {bonus}?
      a: Usually within 24 hours of your qualifying deposit, straight into your Wealthsimple Chequing account. No Chequing account yet? Open one for free — you have 90 days before the bonus expires.
    - q: Does the Wealthsimple referral code work in Quebec?
      a: Yes. The program is open to legal residents of every Canadian province and territory, including Quebec, who have reached the age of majority (18 or 19 depending on the province).
    - q: Can I use more than one referral code?
      a: No. Each new client can be linked to a single referrer, so pick one code and stick with it.
    - q: I already have a Wealthsimple account. Can I still get the bonus?
      a: The bonus is for new clients. If you opened your account recently, you can still add a code within 7 days of your first deposit. Existing clients earn by sharing their own referral code.
    - q: Is {code} a legit, working Wealthsimple code?
      a: Yes. **{code}** is a personal referral code issued by Wealthsimple to a real client, last verified on {verifiedDate}. This site isn’t affiliated with Wealthsimple; when you use the code, the referrer also receives {bonus} — that’s how the program works.
