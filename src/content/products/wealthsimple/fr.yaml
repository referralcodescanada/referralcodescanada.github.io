  items:
    - title: Ouvrez mon lien d’invitation
      text: Touchez [{linkDisplay}]({link}) sur votre téléphone ou ordinateur. Votre nouveau compte est automatiquement associé au code **{code}**.
    - title: Créez votre compte
      text: Inscrivez-vous dans l’application Wealthsimple ou sur le Web et vérifiez votre identité avec une pièce d’identité avec photo émise par le gouvernement.
