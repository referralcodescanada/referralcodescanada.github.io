  items:
    - q: Est-ce que ces codes de parrainage sont gratuits?
      a: Oui. Utiliser un code de parrainage ne coûte rien — il débloque seulement la prime d’inscription offerte par l’entreprise.
    - q: Ce site est-il affilié aux entreprises mentionnées?
      a: Non. {name} est un site indépendant. Les codes sont des codes de parrainage personnels; les marques appartiennent à leurs propriétaires respectifs.
    - q: À quelle fréquence les codes sont-ils vérifiés?
      a: Chaque page affiche sa date de dernière vérification. Les codes et primes sont revérifiés régulièrement selon les conditions officielles.
